<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FORTEXIV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: editorial storefront. Lime hero panel, grey-green PO band, three-column story rows, black primary buttons, one dashboard shell for Seller and Admin. */
:root{
  --bg:#FAFBF6;--surface:#FFFFFF;--soft:#EEF2E8;--ink:#14291A;--muted:#587050;--line:#D5DDCE;
  --band:#C9D5C5;--lime:#A9CB5B;--limeink:#16301A;--btn:#0F140F;--btnink:#FFFFFF;--btn2:#E7EBE2;
  --good:#2C6E31;--goodbg:#E0EFDA;--warn:#85570A;--warnbg:#FBEFCF;--bad:#A8261F;--badbg:#FADCD8;--info:#235A78;--infobg:#DBEAF2;
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;--r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E160F;--surface:#152017;--soft:#1B2A1D;--ink:#E7F0E1;--muted:#A3BB99;--line:#2A3B2C;
  --band:#25362A;--lime:#8DB04A;--limeink:#0D1A0F;--btn:#E7F0E1;--btnink:#0E160F;--btn2:#223325;
  --good:#8CD08F;--goodbg:#1D3320;--warn:#E8B95A;--warnbg:#3A2E12;--bad:#F2A19A;--badbg:#42201D;--info:#8CC4E2;--infobg:#17303F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E160F;--surface:#152017;--soft:#1B2A1D;--ink:#E7F0E1;--muted:#A3BB99;--line:#2A3B2C;
  --band:#25362A;--lime:#8DB04A;--limeink:#0D1A0F;--btn:#E7F0E1;--btnink:#0E160F;--btn2:#223325;
  --good:#8CD08F;--goodbg:#1D3320;--warn:#E8B95A;--warnbg:#3A2E12;--bad:#F2A19A;--badbg:#42201D;--info:#8CC4E2;--infobg:#17303F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:800}
h2{font-size:clamp(1.5rem,2.8vw,2rem);font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block}
.ico{flex:none}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.demobar{background:var(--ink);color:var(--bg);font-size:.78rem;text-align:center;padding:5px 12px}
/* header */
.hd{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding-block:18px}
.brand{font-family:var(--fd);font-weight:800;font-size:1.35rem;text-decoration:none;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50% 0 50% 50%;background:var(--lime);display:inline-block;transform:rotate(-20deg)}
.hsearch{display:flex;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:0 6px 0 16px;background:var(--surface);max-width:560px;width:100%;justify-self:center}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;outline:none}
.hsearch button{border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:6px}
.hicons{display:flex;gap:6px;align-items:center}
.ib{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;cursor:pointer;text-decoration:none}
.ib:hover{background:var(--soft)}
.ib .n{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--btn);color:var(--btnink);font-size:.7rem;display:grid;place-items:center;padding:0 4px;font-weight:700}
.nav{display:flex;justify-content:center;gap:clamp(18px,5vw,56px);padding-bottom:14px;flex-wrap:wrap}
.nav a{text-decoration:none;font-weight:600;padding:4px 2px 5px;border-bottom:2px solid transparent}
.nav a.on{border-color:var(--good);color:var(--good)}
.nav a:hover{border-color:var(--line)}
.umenu{position:relative}
.umenu summary{list-style:none;cursor:pointer}
.umenu summary::-webkit-details-marker{display:none}
.umenu .pop{position:absolute;right:0;top:46px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:220px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.umenu .pop a,.umenu .pop button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:6px;border:0;background:transparent;text-decoration:none;cursor:pointer}
.umenu .pop a:hover,.umenu .pop button:hover{background:var(--soft)}
.umenu .who{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.2}
.btn:hover{opacity:.88}
.btn.sec{background:var(--btn2);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed}
.btn.dk{background:#0F140F;color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* hero */
.hero{background:var(--lime);color:var(--limeink);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;min-height:340px;position:relative}
.hero .tx{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:16px;justify-content:center}
.hero .tx p{max-width:46ch;font-size:1.05rem}
.hero .tx .kick{font-weight:600;font-size:.9rem}
.hero .pic{position:relative;min-height:260px}
.hero .pic img{position:absolute;object-fit:cover;border-radius:10px;box-shadow:0 8px 24px rgba(10,40,10,.25)}
.hero .pic .i1{inset:0 0 0 0;width:100%;height:100%;border-radius:0;box-shadow:none}
.hero .pic .i2{width:34%;aspect-ratio:1;right:6%;bottom:9%;border:4px solid var(--lime)}
.hero .pic .i3{width:26%;aspect-ratio:1;left:8%;top:10%;border:4px solid var(--lime)}
.dots{position:absolute;left:clamp(24px,4vw,48px);bottom:16px;display:flex;gap:8px}
.dots button{width:26px;height:6px;border-radius:3px;border:0;background:rgba(22,48,26,.3);cursor:pointer;padding:0}
.dots button.on{background:var(--limeink)}
.band{background:var(--band);border-radius:6px;padding:12px 18px;display:flex;gap:10px 18px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:16px;font-weight:600;text-align:center}
.sec-b{border-top:1px solid var(--line);padding-block:44px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.story{display:flex;flex-direction:column;gap:10px;text-decoration:none}
.story .im{aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--soft)}
.story .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.story:hover .im img{transform:scale(1.03)}
.story h3{font-size:1.05rem}
.story p{color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(24px,5vw,64px);align-items:center}
.split .big{border-radius:6px;overflow:hidden;aspect-ratio:4/3;background:var(--soft)}
.split .big img{width:100%;height:100%;object-fit:cover}
.subs{display:flex;flex-direction:column;gap:22px;margin:22px 0}
.subs h3{font-size:1rem;margin-bottom:2px}
.subs p{color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;counter-reset:s}
.steps li{list-style:none;border-top:2px solid var(--ink);padding-top:12px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--fd);font-weight:800;font-size:1.6rem;display:block;color:var(--good)}
.steps{padding:0;margin:0}
.steps p{color:var(--muted);margin-top:4px}
.qcard{border:1px solid var(--line);border-radius:8px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.qcard q{font-family:var(--fd);font-size:1.15rem;font-weight:600;line-height:1.3;quotes:none}
.ctab{background:var(--soft);padding-block:36px;margin-top:20px}
.ctab .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.ft{border-top:1px solid var(--line);padding-block:36px;margin-top:0}
.ft .cols{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:28px}
.ft h4{font-size:.9rem;margin-bottom:10px}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ft a{text-decoration:none;color:var(--muted)}
.ft a:hover{color:var(--ink)}
/* product card */
.pcard{display:flex;flex-direction:column;gap:10px;position:relative}
.pcard .pim{display:block;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--soft);position:relative}
.pcard .pim img{width:100%;height:100%;object-fit:cover}
.pcard .bd{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pcard h3 a{text-decoration:none}
.pcard .pr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .price{font-weight:700}
.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#14291A;display:grid;place-items:center;cursor:pointer}
.heart.on{color:#B3261E}
.heart.on svg{fill:currentColor}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--soft);color:var(--ink);white-space:nowrap;line-height:1.5}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.info{background:var(--infobg);color:var(--info)}
.chip.dark{background:var(--btn);color:var(--btnink)}
/* forms */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-weight:600;font-size:.88rem}
.fld .hint{font-size:.8rem;color:var(--muted)}
.fld .err{font-size:.82rem;color:var(--bad);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px;min-width:0}
textarea{min-height:92px;resize:vertical}
input.bad,textarea.bad,select.bad{border-color:var(--bad)}
.frm{display:flex;flex-direction:column;gap:14px}
.frm2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chk{display:flex;gap:9px;align-items:flex-start}
.chk input{margin-top:4px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:22px}
.filters .fld{min-width:160px;flex:1 1 160px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:.88rem}
.pill.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
/* generic blocks */
.pgh{padding-block:34px 18px;display:flex;flex-direction:column;gap:8px}
.crumb{font-size:.85rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb a{text-decoration:none}
.box{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:18px}
.box h3{margin-bottom:10px}
.note{border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--infobg);color:var(--info);font-size:.92rem}
.note.good{background:var(--goodbg);color:var(--good)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.bad{background:var(--badbg);color:var(--bad)}
.note b{font-weight:700}
.empty{border:1px dashed var(--line);border-radius:10px;padding:44px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:1.05rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;min-width:640px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.9rem}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:700;background:var(--soft)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--soft)}
.cart-i{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-i:last-child{border-bottom:0}
.cart-i img{width:84px;height:84px;object-fit:cover;border-radius:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.qty button{border:0;background:transparent;width:34px;height:36px;cursor:pointer;display:grid;place-items:center}
.qty input{width:48px;text-align:center;border:0;padding:6px 0;background:transparent;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:start}
.pd .ph{aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--soft)}
.pd .ph img{width:100%;height:100%;object-fit:cover}
.art-cover{aspect-ratio:21/9;border-radius:10px;overflow:hidden;background:var(--soft)}
.art-cover img{width:100%;height:100%;object-fit:cover}
.prose{max-width:68ch}
.prose h2{margin:34px 0 10px;font-size:1.5rem}
.prose p{margin-bottom:12px}
.prose ol{padding-left:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:12px}
.prose ol li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:10px}
.prose ol li::before{content:counter(p);font-family:var(--fd);font-weight:800;color:var(--good);font-size:1.3rem}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:grid;grid-template-columns:10px 1fr;gap:12px}
.tl li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--good);margin-top:6px}
.tl .t{font-size:.8rem;color:var(--muted)}
.grp{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.grp.done{background:var(--goodbg)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox svg{background:#fff;padding:8px;border-radius:6px;border:1px solid var(--line)}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;background:var(--soft);padding:2px 6px;border-radius:4px;word-break:break-all}
details.faq{border-bottom:1px solid var(--line);padding:14px 0}
details.faq summary{cursor:pointer;font-weight:600;font-family:var(--fd);font-size:1.05rem}
details.faq p{margin-top:8px;color:var(--muted);max-width:70ch}
.rolecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rc{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.rc:hover{border-color:var(--ink)}
.rc b{font-family:var(--fd);font-size:1.05rem}
.loginwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);padding-block:44px;align-items:start}
/* dashboard */
.dtop{background:var(--surface);border-bottom:1px solid var(--line)}
.dtop .in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.shell{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:24px 56px}
.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;align-self:start}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--muted)}
.side a:hover{background:var(--soft);color:var(--ink)}
.side a.on{background:var(--btn);color:var(--btnink)}
.side .grp-l{font-size:.75rem;font-weight:700;color:var(--muted);padding:12px 12px 4px}
.dmain{min-width:0;display:flex;flex-direction:column;gap:22px}
.dh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--fd);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(8,16,9,.55);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.md{background:var(--surface);border-radius:12px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.md.wide{max-width:760px}
.md header{display:flex;justify-content:space-between;align-items:start;gap:10px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:520px;pointer-events:auto}
.toast.bad{background:var(--bad);color:#fff}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:960px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}

async function migrateDemo(){
  const legacyAuth=!S.auth||S.auth.version<2;
  S.auth=S.auth||{pending:null,passwordHashes:{},reset:null,lastSentAt:0};
  S.auth.version=2;
  S.auth.passwordHashes=S.auth.passwordHashes||{};
  S.articles=S.articles||[];
  S.articles.forEach(a=>{a.type=a.type||'project';a.updatedAt=a.updatedAt||a.date||Date.now()});
  S.products.forEach(p=>{
    if(p.story){
      if(!S.articles.some(a=>a.type==='product'&&a.productId===p.id)){
        S.articles.push({id:'story-'+p.id,type:'product',classId:p.classId,productId:p.id,title:'Cerita '+p.name,summary:p.desc,content:p.story,productIds:[p.id],cover:p.art,status:'published',date:Date.now(),updatedAt:Date.now()});
      }
      delete p.story;
    }
  });
  for(const u of S.users){
    if(u.pw){
      try{S.auth.passwordHashes[u.id]=await hashPassword(u.pw,u.id)}catch(err){console.error('Could not migrate a legacy demo password.',err)}
    }
    delete u.pw;u.active=u.active!==false;u.emailVerified=u.emailVerified!==false;
  }
  if(legacyAuth)S.session=null;
  save();
}

  const open=S.orders.filter(o=>o.payment==='berhasil').reduce((a,o)=>a+o.groups.filter(g=>!isDone(g)).length,0);if(open)b.push(open+' kelompok pengambilan belum diserahkan atau diselesaikan.');
  const rf=S.refunds.filter(r=>r.status==='diajukan').length;if(rf)b.push(rf+' refund belum diputuskan.');
  const py=S.payouts.filter(p=>p.status!=='dibayarkan').length;if(py)b.push(py+' payout belum dibayarkan.');
  const mod=S.products.filter(p=>p.status==='pending').length;if(mod)b.push(mod+' produk masih menunggu moderasi.');
  return b;
}

/* ====== router ====== */
let nextPath=null,prevPath=null,freshNav=true;
function need(roles){
  const u=cur();
  if(!u){nextPath=current;current='/masuk';try{location.hash='/masuk'}catch(e){}route=parseRoute('/masuk');return viewLogin('Masuk untuk melanjutkan ke halaman ini.')}
  if(!roles.includes(u.role))return denied('Akun '+u.role+' tidak boleh membuka halaman ini. Masuk dengan akun yang sesuai.');
  return null;
}
function resolve(){
  const p=route.parts,k=p[0]||'',u=cur();let g;
  if(!k)return viewHome();
  if(k==='artikel')return p[1]?viewArticle(p[1]):viewArticles();
  if(k==='produk')return p[1]?viewProduct(p[1]):viewCatalog();
  if(k==='favorit')return viewWishlist();
  if(k==='keranjang')return viewCart();
  if(k==='bantuan')return viewFaq();
  if(k==='masuk')return viewLogin();
  if(k==='otp')return viewOtp();
  if(k==='verifikasi')return viewEmailVerification();
  if(k==='lupa-password')return viewForgotPassword();
  if(k==='reset-password')return viewResetPassword();
  if(k==='daftar')return viewRegister();
  if(k==='checkout'){if(g=need(['buyer','seller','admin']))return g;return viewCheckout()}
  if(k==='bayar'){if(g=need(['buyer','admin','seller']))return g;return viewPay(p[1])}
  if(k==='pesanan'){if(g=need(['buyer']))return g;return p[1]?viewOrderDetail(p[1]):viewMyOrders()}
  if(k==='seller'){if(g=need(['seller']))return g;
    const s=p[1]||'';
    if(!s)return viewSellerHome();if(s==='produk')return viewSellerProducts();if(s==='pesanan')return p[2]?viewSellerOrder(p[2]):viewSellerOrders();
    if(s==='scan')return viewSellerScan();if(s==='payout')return viewSellerPayout();return notFound()}
  if(k==='admin'){if(g=need(['admin']))return g;
    const s=p[1]||'';
    if(!s)return viewAdminHome();if(s==='konten')return p[2]?viewAdminEditor(p[2]):viewAdminContent();if(s==='produk')return viewAdminProducts();
    if(s==='pesanan')return p[2]?viewAdminOrder(p[2]):viewAdminOrders();if(s==='refund')return viewAdminRefunds();if(s==='payout')return viewAdminPayouts();if(s==='po')return viewAdminPO();return notFound()}
  return notFound();
}
function render(){
  expirePending();
  route=parseRoute(current);freshNav=prevPath!==route.path;
  let html;try{html=resolve()}catch(e){console.error(e);html=pub(`<div class="wrap"><div class="pgh">${emptyBox('Terjadi kesalahan menampilkan halaman','Muat ulang halaman atau kembali ke beranda.',`<a class="btn" href="#/">Beranda</a>`)}</div></div>`)}
  $('#app').innerHTML=html;
  if(freshNav){try{window.scrollTo(0,0)}catch(e){}}
  prevPath=route.path;S.lastRoute=current;save();startHero();
}
function startHero(){
  clearInterval(heroTimer);
  if(route.path!=='/'||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  heroTimer=setInterval(()=>{const h=$('#hero');if(!h||route.path!=='/'){clearInterval(heroTimer);return}heroIdx++;h.innerHTML=heroHtml()},7000);
}

/* ====== validation helpers ====== */
function clearErr(f){$$('[data-e]',f).forEach(e=>{e.hidden=true;e.textContent=''});$$('.bad',f).forEach(e=>e.classList.remove('bad'))}
function showErr(f,map){
  clearErr(f);let first=null;
  Object.keys(map).forEach(k=>{const e=$(`[data-e="${k}"]`,f),i=f.elements[k];if(e){e.textContent=map[k];e.hidden=false}if(i&&i.classList){i.classList.add('bad');if(!first)first=i}});
  if(first&&first.focus)first.focus();return false;
}
const isEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
const role=r=>{const u=cur();return u&&u.role===r};
async function hashPassword(password,userId){
  if(!window.crypto||!window.crypto.subtle)throw new Error('Penyimpanan kata sandi demo membutuhkan browser dengan Web Crypto.');
  const bytes=new TextEncoder().encode('fortexiv-demo:'+userId+':'+password);
  const digest=await window.crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
}
const demoCode=()=>String(Math.floor(Math.random()*1e6)).padStart(6,'0');
function issueAuthCode(kind,user){
  const now=Date.now();
  const previous=S.auth.pending;
  S.auth.pending={kind,userId:user.id,code:demoCode(),expiresAt:now+AUTH_TTL,attempts:0,lastSentAt:now};
  if(!save()){S.auth.pending=previous;return false}
  return true;
}
function authError(selector,message){
  const el=$(selector);if(el){el.hidden=false;el.textContent=message}
}
function verifyCode(record,code){
  if(!record||Date.now()>record.expiresAt)return'Kedaluwarsa';
  if(record.attempts>=AUTH_MAX_ATTEMPTS)return'Batas percobaan';
  if(code!==record.code){record.attempts++;save();return record.attempts>=AUTH_MAX_ATTEMPTS?'Batas percobaan':'Kode salah'}
  return'Valid';
}

function cartErrors(pid,qty){
  const p=prodOf(pid),ps=poStatus(),e=[];

  if(p.stock<=0)e.push('Stok habis.');
  const ex=(S.cart.find(c=>c.pid===pid)||{qty:0}).qty;
  if(p.stock>0&&qty+ex>p.stock)e.push('Stok tersisa '+p.stock+(ex?' dan '+ex+' sudah ada di keranjang':'')+'.');

F.resetPassword=async(f,d)=>{
  const r=S.auth.reset,pw=d.get('pw')||'',pw2=d.get('pw2')||'',code=(d.get('code')||'').trim(),e={};
  if(!/^\d{6}$/.test(code))e.code='Masukkan token reset 6 digit.';
  if(pw.length<8)e.pw='Kata sandi minimal 8 karakter.';
  if(pw2!==pw)e.pw2='Konfirmasi kata sandi tidak sama.';
  if(Object.keys(e).length)return showErr(f,e);
  if(!r||r.used||Date.now()>r.expiresAt){authError('#reset-err','Token reset tidak valid atau sudah kedaluwarsa.');return false}
  const result=verifyCode(r,code);
  if(result!=='Valid'){
    authError('#reset-err',result==='Kedaluwarsa'?'Token reset sudah kedaluwarsa.':'Token reset salah atau batas percobaan tercapai.');
    if(result==='Batas percobaan'){r.used=true;r.code=null;save()}
    return false;
  }
  try{
    const userId=r.userId,hash=await hashPassword(pw,userId),previousHash=S.auth.passwordHashes[userId],previousReset={...r};
    S.auth.passwordHashes[userId]=hash;r.used=true;r.code=null;S.auth.reset=null;
    if(!save()){if(previousHash)S.auth.passwordHashes[userId]=previousHash;else delete S.auth.passwordHashes[userId];S.auth.reset=previousReset;return false}
    toast('Kata sandi diperbarui. Silakan login dan verifikasi OTP.');go('/masuk');return false;
  }catch(err){console.error(err);authError('#reset-err','Kata sandi tidak dapat disimpan pada browser ini.');return false}
};

  if(a){ev.preventDefault();go(a.getAttribute('href').slice(1));return}
  if(ev.target.dataset&&ev.target.dataset.ov){closeModal();return}
  $$('details.umenu[open]').forEach(d=>{if(!d.contains(ev.target))d.removeAttribute('open')});
  const el=ev.target.closest&&ev.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn)fn(el,ev);
});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest&&ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
  const h=F[f.dataset.form];if(!h)return;
  const ok=h(f,new FormData(f),ev);if(ok&&f.dataset.modal)closeModal();
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t.dataset)return;
  if(t.dataset.input==='cf'){CF[t.dataset.k]=t.value;const g=$('#pgrid');if(g)g.innerHTML=productGrid()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;if(!t.dataset||t.dataset.input!=='cartq')return;
  const l=S.cart.find(c=>c.pid===t.dataset.id),p=prodOf(t.dataset.id);if(!l||!p)return;
  let n=parseInt(t.value,10);if(!(n>=1))n=1;if(n>p.stock){toast('Stok '+p.name+' tersisa '+p.stock+'.','bad');n=p.stock}
  l.qty=n;save();render();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modal-root').firstChild)closeModal()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'/';if(h!==current){current=h;closeModal();render()}});
current=location.hash.slice(1)||S.lastRoute||'/';
try{if(!location.hash&&current!=='/')history.replaceState(null,'','#'+current)}catch(e){console.error('Could not restore the previous demo route.',e)}
migrateDemo().then(()=>render()).catch(e=>{console.error('Demo initialization failed.',e);toast('Data demo gagal dimuat. Muat ulang halaman.','bad')});

})();
</script>
