<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | Northstar Catalog</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #f4f6f8;
      color: #17202a;
      font-family: Arial, sans-serif;
    }

    .login-layout {
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.1fr);
      width: min(900px, 100%);
      min-height: 520px;
      overflow: hidden;
      background: white;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(22, 50, 79, 0.12);
      animation: appear 450ms ease-out both;
    }

    .brand-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px;
      color: white;
      background: #16324f;
    }

    .brand-mark {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .brand-message h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.12;
    }

    .brand-message p,
    .brand-footer {
      color: #d5e5f5;
      line-height: 1.6;
    }

    .brand-footer {
      margin: 0;
      font-size: 13px;
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px clamp(26px, 6vw, 64px);
    }

    .form-panel h2 {
      margin: 0 0 8px;
      color: #16324f;
      font-size: 28px;
    }

    .intro {
      margin: 0 0 30px;
      color: #667788;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #c7d0d9;
      border-radius: 4px;
      background: white;
      color: #17202a;
      font: inherit;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #7eb8e6;
      outline-offset: 2px;
    }

    .password-wrap {
      display: flex;
      gap: 8px;
    }

    .password-wrap input {
      min-width: 0;
    }

    .reveal-button {
      flex: 0 0 auto;
      padding: 0 12px;
      border: 1px solid #c7d0d9;
      border-radius: 4px;
      background: white;
      color: #16324f;
      font: inherit;
      cursor: pointer;
    }

    .options {
      display: flex;
      align-items: center;
      margin: 0 0 24px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #455565;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #16704a;
    }

    .submit-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 4px;
      background: #16704a;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease;
    }

    .submit-button:hover {
      background: #105b3b;
    }

    .status {
      min-height: 24px;
      margin: 14px 0 0;
      color: #9a4f12;
      font-size: 14px;
      line-height: 1.5;
    }

    .back-link {
      align-self: center;
      margin-top: 20px;
      color: #16324f;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .login-layout {
        grid-template-columns: 1fr;
      }

      .brand-panel {
        min-height: 190px;
        padding: 24px;
      }

      .brand-message h1 {
        font-size: 30px;
      }

      .brand-message p {
        margin-bottom: 0;
      }

      .brand-footer {
        display: none;
      }

      .form-panel {
        padding: 30px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="login-layout">
    <section class="brand-panel" aria-label="Northstar Catalog">
      <p class="brand-mark">Northstar Catalog</p>
      <div class="brand-message">
        <h1>Temukan hal yang membuat hari lebih baik.</h1>
        <p>Masuk untuk melanjutkan menjelajahi koleksi pilihan kami.</p>
      </div>
      <p class="brand-footer">Pilihan sederhana untuk keseharian.</p>
    </section>

    <section class="form-panel" aria-labelledby="login-title">
      <h2 id="login-title">Selamat datang kembali</h2>
      <p class="intro">Masukkan detail akun Anda untuk masuk.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
        </div>

        <div class="field">
          <label for="password">Kata sandi</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="reveal-button" id="togglePassword" type="button" aria-pressed="false">Lihat</button>
          </div>
        </div>

        <div class="options">
          <label class="remember" for="remember">
            <input id="remember" name="remember" type="checkbox">
            Ingat saya
          </label>
        </div>

        <button class="submit-button" type="submit">Masuk</button>
        <p class="status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <a class="back-link" href="index.html">Kembali ke katalog</a>
    </section>
  </main>

  <script>
    const passwordInput = document.querySelector("#password");
    const togglePassword = document.querySelector("#togglePassword");
    const loginForm = document.querySelector("#loginForm");
    const formStatus = document.querySelector("#formStatus");

    togglePassword.addEventListener("click", () => {
      const isVisible = passwordInput.type === "text";
      passwordInput.type = isVisible ? "password" : "text";
      togglePassword.textContent = isVisible ? "Lihat" : "Sembunyikan";
      togglePassword.setAttribute("aria-pressed", String(!isVisible));
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      formStatus.textContent = "Form siap digunakan. Hubungkan ke backend untuk mengaktifkan autentikasi.";
    });
  </script>
</body>
</html>
